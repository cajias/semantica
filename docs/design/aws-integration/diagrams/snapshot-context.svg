<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="566" fill="#fbfbfd"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a202c">The snapshot subsystem in context</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#4a5568">who changes the graph, and where the only durable copy of it lives</text>

  <!-- column headers -->
  <text x="20" y="88" font-size="11.5" font-weight="600" fill="#718096" letter-spacing="0.5">ACTORS AND PLATFORM</text>
  <text x="700" y="88" font-size="11.5" font-weight="600" fill="#718096" letter-spacing="0.5">EXTERNAL DEPENDENCIES</text>

  <!-- actors -->
  <rect x="20" y="96" width="178" height="74" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
  <text x="109" y="122" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Operator</text>
  <text x="109" y="141" text-anchor="middle" font-size="11" fill="#4a5568">declares a destination</text>
  <text x="109" y="157" text-anchor="middle" font-size="11" fill="#4a5568">and an interval</text>

  <rect x="20" y="182" width="178" height="74" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
  <text x="109" y="208" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Analyst and Agent</text>
  <text x="109" y="227" text-anchor="middle" font-size="11" fill="#4a5568">record and query</text>
  <text x="109" y="243" text-anchor="middle" font-size="11" fill="#4a5568">decisions over HTTP</text>

  <rect x="20" y="268" width="178" height="74" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
  <text x="109" y="291" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Contributor and</text>
  <text x="109" y="309" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Reviewer</text>
  <text x="109" y="328" text-anchor="middle" font-size="11" fill="#4a5568">new change routes, checks</text>

  <!-- hosting platform -->
  <rect x="20" y="356" width="178" height="80" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="109" y="382" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Hosting platform</text>
  <text x="109" y="401" text-anchor="middle" font-size="11" fill="#4a5568">supervises the process,</text>
  <text x="109" y="417" text-anchor="middle" font-size="11" fill="#4a5568">one live instance</text>

  <!-- inbound edges -->
  <path d="M 198 133 L 298 133" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#snapshot-context-grey)"/>
  <text x="248" y="122" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4a5568">two declarations</text>
  <text x="248" y="148" text-anchor="middle" font-size="10" fill="#718096">read at start-up</text>

  <path d="M 198 219 L 298 219" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#snapshot-context-blue)"/>
  <text x="248" y="208" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2b6cb0">HTTP routes</text>
  <text x="248" y="234" text-anchor="middle" font-size="10" fill="#718096">changes, queries</text>

  <path d="M 198 305 L 298 305" stroke="#718096" stroke-width="2" fill="none" marker-end="url(#snapshot-context-grey)"/>
  <text x="248" y="294" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4a5568">change routes</text>
  <text x="248" y="320" text-anchor="middle" font-size="10" fill="#718096">arrive announced</text>

  <path d="M 198 396 L 298 396" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#snapshot-context-blue)"/>
  <text x="248" y="385" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2b6cb0">start and stop</text>
  <text x="248" y="411" text-anchor="middle" font-size="10" fill="#718096">lifecycle signals</text>

  <!-- system in scope -->
  <rect x="300" y="96" width="300" height="340" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="314" y="120" font-size="11.5" font-weight="600" fill="#2b6cb0" letter-spacing="0.5">GRAPH DURABILITY SUBSYSTEM</text>
  <text x="314" y="136" font-size="10.5" fill="#718096">the system in scope</text>

  <rect x="312" y="148" width="276" height="52" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="450" y="173" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Semantica Knowledge Explorer</text>
  <text x="450" y="191" text-anchor="middle" font-size="11" fill="#4a5568">one serving process, one graph</text>

  <rect x="312" y="210" width="276" height="62" rx="6" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
  <text x="450" y="233" text-anchor="middle" font-size="12.5" font-weight="600" fill="#744210">graph held in memory</text>
  <text x="450" y="252" text-anchor="middle" font-size="11.5" fill="#744210">ends when the process ends</text>
  <text x="450" y="266" text-anchor="middle" font-size="10.5" fill="#b7791f">no second copy inside this box</text>

  <rect x="312" y="284" width="276" height="30" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="450" y="304" text-anchor="middle" font-size="11.5" fill="#1a202c">restores the record before serving</text>

  <rect x="312" y="320" width="276" height="30" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="450" y="340" text-anchor="middle" font-size="11.5" fill="#1a202c">marks every announced change pending</text>

  <rect x="312" y="356" width="276" height="30" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="450" y="376" text-anchor="middle" font-size="11.5" fill="#1a202c">writes on an interval and on a stop</text>

  <text x="450" y="399" text-anchor="middle" font-size="10.5" fill="#718096">one write per interval, however many edits</text>
  <text x="450" y="416" text-anchor="middle" font-size="10.5" fill="#718096">a graceful stop writes the remainder</text>

  <!-- store edges -->
  <path d="M 600 196 L 698 196" stroke="#2f855a" stroke-width="2" fill="none" marker-end="url(#snapshot-context-green)"/>
  <text x="649" y="186" text-anchor="middle" font-size="10" font-weight="600" fill="#2f855a">replace per write</text>
  <text x="649" y="210" text-anchor="middle" font-size="10" fill="#718096">one whole record</text>

  <path d="M 698 250 L 602 250" stroke="#2f855a" stroke-width="2" fill="none" marker-end="url(#snapshot-context-green)"/>
  <text x="649" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#2f855a">read at start</text>
  <text x="649" y="264" text-anchor="middle" font-size="10" fill="#718096">once per boot</text>

  <path d="M 600 412 L 698 412" stroke="#718096" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#snapshot-context-grey)"/>
  <text x="649" y="402" text-anchor="middle" font-size="10" font-weight="600" fill="#4a5568">assumes a role</text>
  <text x="649" y="426" text-anchor="middle" font-size="10" fill="#718096">per call</text>

  <!-- stored record -->
  <rect x="700" y="96" width="220" height="258" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="714" y="120" font-size="11.5" font-weight="600" fill="#2f855a" letter-spacing="0.5">STORED RECORD</text>
  <text x="714" y="136" font-size="10.5" fill="#718096">one family per deployment</text>

  <rect x="714" y="146" width="192" height="88" rx="7" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="810" y="171" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">Network object storage</text>
  <text x="810" y="190" text-anchor="middle" font-size="11" fill="#4a5568">lifetime independent</text>
  <text x="810" y="206" text-anchor="middle" font-size="11" fill="#4a5568">of any instance</text>
  <text x="810" y="225" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2f855a">s3://bucket/key</text>

  <text x="810" y="248" text-anchor="middle" font-size="11" font-style="italic" fill="#718096">or</text>

  <rect x="714" y="256" width="192" height="88" rx="7" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="810" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">Host-attached storage</text>
  <text x="810" y="300" text-anchor="middle" font-size="11" fill="#4a5568">lifetime of the host</text>
  <text x="810" y="316" text-anchor="middle" font-size="11" fill="#4a5568">or its volume</text>
  <text x="810" y="335" text-anchor="middle" font-size="10.5" font-style="italic" fill="#718096">a filesystem path</text>

  <!-- credentials -->
  <rect x="700" y="374" width="220" height="76" rx="8" fill="#ffffff" stroke="#718096" stroke-width="1.6"/>
  <text x="810" y="399" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">Credential provider</text>
  <text x="810" y="418" text-anchor="middle" font-size="11" fill="#4a5568">role-based, temporary</text>
  <text x="810" y="434" text-anchor="middle" font-size="11" fill="#4a5568">credentials, no stored key</text>

  <!-- the one invariant -->
  <rect x="20" y="468" width="900" height="78" rx="9" fill="#fffaf0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="40" y="494" font-size="12" font-weight="600" fill="#744210" letter-spacing="0.5">THE ONE INVARIANT</text>
  <text x="40" y="520" font-size="13" fill="#744210">The graph lives in one process's memory. Only the stored record outlives that process,</text>
  <text x="40" y="540" font-size="13" fill="#744210">so a restart returns exactly what the last completed write holds, and nothing after it.</text>

  <defs>
    <marker id="snapshot-context-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2b6cb0"/></marker>
    <marker id="snapshot-context-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2f855a"/></marker>
    <marker id="snapshot-context-grey" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#718096"/></marker>
  </defs>
</svg>

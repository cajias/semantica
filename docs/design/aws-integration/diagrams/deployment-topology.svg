<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="470" fill="#fbfbfd"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a202c">Deployment topology</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#4a5568">One managed component between the client and the container</text>

  <!-- client -->
  <rect x="28" y="176" width="140" height="72" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
  <text x="98" y="206" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Browser or</text>
  <text x="98" y="226" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">API client</text>

  <path d="M 168 212 L 246 212" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#a1)"/>
  <text x="207" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b6cb0">HTTPS</text>
  <text x="207" y="232" text-anchor="middle" font-size="10.5" fill="#718096">managed certificate</text>

  <!-- managed container service boundary -->
  <rect x="254" y="112" width="332" height="228" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="270" y="136" font-size="11.5" font-weight="600" fill="#2b6cb0" letter-spacing="0.5">MANAGED CONTAINER SERVICE</text>

  <rect x="274" y="150" width="292" height="30" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="420" y="170" text-anchor="middle" font-size="12" fill="#1a202c">TLS termination, public endpoint</text>

  <rect x="274" y="190" width="292" height="30" rx="5" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="420" y="210" text-anchor="middle" font-size="12" fill="#1a202c">health checking and restart</text>

  <rect x="274" y="234" width="292" height="90" rx="7" fill="#ffffff" stroke="#2f855a" stroke-width="2.2"/>
  <text x="420" y="259" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">Knowledge Explorer</text>
  <text x="420" y="279" text-anchor="middle" font-size="12" fill="#4a5568">single instance, non-privileged</text>
  <text x="420" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#2f855a">graph held in memory</text>
  <text x="420" y="316" text-anchor="middle" font-size="11" fill="#718096">analytics components disabled</text>

  <!-- object storage -->
  <path d="M 586 268 L 664 268" stroke="#2f855a" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <path d="M 664 292 L 586 292" stroke="#2f855a" stroke-width="2" fill="none" marker-end="url(#a3)"/>
  <text x="625" y="258" text-anchor="middle" font-size="10.5" fill="#4a5568">flush</text>
  <text x="625" y="312" text-anchor="middle" font-size="10.5" fill="#4a5568">hydrate</text>

  <rect x="672" y="222" width="240" height="118" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="792" y="250" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">Object storage</text>
  <text x="792" y="272" text-anchor="middle" font-size="12" fill="#4a5568">one snapshot object</text>
  <text x="792" y="292" text-anchor="middle" font-size="12" fill="#4a5568">versioning enabled</text>
  <text x="792" y="314" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2f855a">every flush is restorable</text>

  <!-- registry -->
  <rect x="672" y="112" width="240" height="76" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.6"/>
  <text x="792" y="140" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1a202c">Container image</text>
  <text x="792" y="162" text-anchor="middle" font-size="11.5" fill="#4a5568">pushed at deploy time</text>
  <text x="792" y="179" text-anchor="middle" font-size="11.5" fill="#4a5568">built from the repository</text>
  <path d="M 672 150 L 594 150" stroke="#718096" stroke-width="1.8" fill="none" marker-end="url(#a4)"/>

  <!-- absent components -->
  <rect x="28" y="372" width="884" height="70" rx="9" fill="#fffaf0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="48" y="396" font-size="12" font-weight="600" fill="#744210" letter-spacing="0.5">DELIBERATELY ABSENT</text>
  <text x="48" y="422" font-size="12.5" fill="#744210">private network  ·  load balancer  ·  outbound gateway  ·  security groups  ·  orchestrator  ·  managed database</text>

  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2b6cb0"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2f855a"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2f855a"/></marker>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#718096"/></marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 604" width="940" height="604" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="604" fill="#fbfbfd"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#1a202c">Containers</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#4a5568">two entry points, one in-memory graph, and a record in exactly one of two families</text>

  <!-- column headers -->
  <text x="20" y="88" font-size="11.5" font-weight="600" fill="#718096" letter-spacing="0.5">OUTSIDE</text>
  <text x="672" y="88" font-size="11.5" font-weight="600" fill="#718096" letter-spacing="0.5">DATASTORE</text>

  <!-- client -->
  <rect x="20" y="146" width="142" height="72" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.8"/>
  <text x="91" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">Browser or</text>
  <text x="91" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">API client</text>
  <text x="91" y="207" text-anchor="middle" font-size="10.5" fill="#4a5568">authenticated calls</text>

  <path d="M 162 182 L 236 182" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#snapshot-containers-blue)"/>
  <text x="199" y="172" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2b6cb0">HTTPS</text>
  <text x="199" y="198" text-anchor="middle" font-size="10" fill="#718096">API key</text>

  <!-- platform -->
  <rect x="20" y="320" width="142" height="72" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="91" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">Hosting</text>
  <text x="91" y="363" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">platform</text>
  <text x="91" y="381" text-anchor="middle" font-size="10.5" fill="#4a5568">one live instance</text>

  <path d="M 162 356 L 236 356" stroke="#2b6cb0" stroke-width="2" fill="none" marker-end="url(#snapshot-containers-blue)"/>
  <text x="199" y="346" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2b6cb0">start, stop</text>
  <text x="199" y="372" text-anchor="middle" font-size="10" fill="#718096">lifespan</text>

  <!-- serving instance -->
  <rect x="238" y="96" width="330" height="318" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="250" y="120" font-size="11.5" font-weight="600" fill="#2b6cb0" letter-spacing="0.5">SERVING INSTANCE</text>
  <text x="250" y="136" font-size="10.5" fill="#718096">one process, either entry point</text>

  <rect x="250" y="150" width="146" height="64" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="323" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">semantica-server</text>
  <text x="323" y="188" text-anchor="middle" font-size="10" fill="#4a5568">REST routes only</text>
  <text x="323" y="204" text-anchor="middle" font-size="10" fill="#718096">no live-update route</text>

  <rect x="410" y="150" width="146" height="64" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="483" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="#1a202c">semantica-explorer</text>
  <text x="483" y="188" text-anchor="middle" font-size="10" fill="#4a5568">adds WebSocket, SPA</text>
  <text x="483" y="204" text-anchor="middle" font-size="10" fill="#718096">the packaged UI</text>

  <rect x="250" y="228" width="306" height="76" rx="7" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
  <text x="403" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#744210">ContextGraph, held in memory</text>
  <text x="403" y="271" text-anchor="middle" font-size="11" fill="#744210">one process, one lock, no second copy</text>
  <text x="403" y="291" text-anchor="middle" font-size="10.5" fill="#b7791f">it ends when the process ends</text>

  <rect x="250" y="318" width="306" height="76" rx="7" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="403" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">SnapshotService</text>
  <text x="403" y="361" text-anchor="middle" font-size="11" fill="#4a5568">restores before the process serves</text>
  <text x="403" y="380" text-anchor="middle" font-size="11" fill="#4a5568">writes on an interval and on a stop</text>

  <!-- store edges -->
  <path d="M 568 330 L 670 330" stroke="#2f855a" stroke-width="2" fill="none" marker-end="url(#snapshot-containers-green)"/>
  <text x="619" y="320" text-anchor="middle" font-size="10" font-weight="600" fill="#2f855a">replace</text>
  <text x="619" y="344" text-anchor="middle" font-size="10" fill="#718096">one record</text>

  <path d="M 670 372 L 570 372" stroke="#2f855a" stroke-width="2" fill="none" marker-end="url(#snapshot-containers-green)"/>
  <text x="619" y="362" text-anchor="middle" font-size="10" font-weight="600" fill="#2f855a">read once</text>
  <text x="619" y="386" text-anchor="middle" font-size="10" fill="#718096">at boot</text>

  <!-- stored record -->
  <rect x="672" y="96" width="248" height="318" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="686" y="120" font-size="11.5" font-weight="600" fill="#2f855a" letter-spacing="0.5">STORED RECORD</text>
  <text x="686" y="136" font-size="10.5" fill="#718096">one family per deployment</text>

  <rect x="686" y="150" width="220" height="110" rx="7" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="796" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">Object storage</text>
  <text x="796" y="193" text-anchor="middle" font-size="11" fill="#4a5568">lifetime independent</text>
  <text x="796" y="209" text-anchor="middle" font-size="11" fill="#4a5568">of any instance</text>
  <text x="796" y="229" text-anchor="middle" font-size="10.5" font-style="italic" fill="#2f855a">s3://bucket/key</text>
  <text x="796" y="248" text-anchor="middle" font-size="10" fill="#718096">staged through TMPDIR</text>

  <text x="796" y="278" text-anchor="middle" font-size="11" font-style="italic" fill="#718096">or</text>

  <rect x="686" y="288" width="220" height="110" rx="7" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
  <text x="796" y="312" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a202c">Filesystem path</text>
  <text x="796" y="331" text-anchor="middle" font-size="11" fill="#4a5568">lifetime of the host</text>
  <text x="796" y="347" text-anchor="middle" font-size="11" fill="#4a5568">or its mounted volume</text>
  <text x="796" y="367" text-anchor="middle" font-size="10.5" font-style="italic" fill="#718096">a plain path</text>
  <text x="796" y="386" text-anchor="middle" font-size="10" fill="#718096">written owner-only</text>

  <!-- how the family is chosen -->
  <rect x="20" y="430" width="900" height="82" rx="9" fill="#fffaf0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="40" y="454" font-size="12" font-weight="600" fill="#744210" letter-spacing="0.5">EXACTLY ONE FAMILY, CHOSEN BY THE DECLARATION</text>
  <text x="40" y="478" font-size="12.5" fill="#744210">An s3:// URI binds object storage; any other value binds a filesystem path. Leaving it unset turns durability off.</text>
  <text x="40" y="498" font-size="12.5" fill="#744210">A near-miss scheme is refused when the store is built, rather than becoming a path inside the container layer.</text>

  <!-- not containers -->
  <rect x="20" y="526" width="900" height="58" rx="9" fill="#ffffff" stroke="#718096" stroke-width="1.5"/>
  <text x="40" y="550" font-size="12" font-weight="600" fill="#4a5568" letter-spacing="0.5">NOT CONTAINERS HERE</text>
  <text x="40" y="572" font-size="12.5" fill="#4a5568">no database, no queue, no cache, no second replica: the record is the only thing that outlives the process</text>

  <defs>
    <marker id="snapshot-containers-blue" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2b6cb0"/></marker>
    <marker id="snapshot-containers-green" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#2f855a"/></marker>
  </defs>
</svg>

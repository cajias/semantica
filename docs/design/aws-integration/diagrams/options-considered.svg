<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="470" fill="#fbfbfd"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1a202c">Indicative monthly cost of the options considered</text>
  <text x="24" y="56" font-size="12" fill="#4a5568">Relative magnitudes for one always-on instance. Illustrative list prices, not a quotation.</text>

  <line x1="300" y1="76" x2="300" y2="420" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="440" y1="76" x2="440" y2="420" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="580" y1="76" x2="580" y2="420" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="720" y1="76" x2="720" y2="420" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="860" y1="76" x2="860" y2="420" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="300" y="440" text-anchor="middle" font-size="11" fill="#718096">0</text>
  <text x="440" y="440" text-anchor="middle" font-size="11" fill="#718096">50</text>
  <text x="580" y="440" text-anchor="middle" font-size="11" fill="#718096">100</text>
  <text x="720" y="440" text-anchor="middle" font-size="11" fill="#718096">150</text>
  <text x="860" y="440" text-anchor="middle" font-size="11" fill="#718096">200</text>
  <text x="580" y="458" text-anchor="middle" font-size="11" fill="#718096">approximate US dollars per month</text>

  <text x="288" y="112" text-anchor="end" font-size="12.5" fill="#1a202c">Graph database, serverless</text>
  <rect x="300" y="90" width="535" height="30" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.2"/>
  <text x="847" y="110" font-size="12" font-weight="600" fill="#742a2a">17x</text>

  <text x="288" y="160" text-anchor="end" font-size="12.5" fill="#1a202c">Graph database, provisioned</text>
  <rect x="300" y="138" width="476" height="30" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.2"/>
  <text x="788" y="158" font-size="12" font-weight="600" fill="#742a2a">15x</text>

  <text x="288" y="208" text-anchor="end" font-size="12.5" fill="#1a202c">Kubernetes cluster</text>
  <rect x="300" y="186" width="420" height="30" rx="4" fill="#feebc8" stroke="#b7791f" stroke-width="1.2"/>
  <text x="732" y="206" font-size="12" font-weight="600" fill="#744210">14x</text>

  <text x="288" y="256" text-anchor="end" font-size="12.5" fill="#1a202c">Orchestrated, file system state</text>
  <rect x="300" y="234" width="213" height="30" rx="4" fill="#feebc8" stroke="#b7791f" stroke-width="1.2"/>
  <text x="525" y="254" font-size="12" font-weight="600" fill="#744210">7x</text>

  <text x="288" y="304" text-anchor="end" font-size="12.5" fill="#1a202c">Orchestrated, private network</text>
  <rect x="300" y="282" width="207" height="30" rx="4" fill="#feebc8" stroke="#b7791f" stroke-width="1.2"/>
  <text x="519" y="302" font-size="12" font-weight="600" fill="#744210">7x</text>

  <text x="288" y="352" text-anchor="end" font-size="12.5" fill="#1a202c">Orchestrated, public, interruptible</text>
  <rect x="300" y="330" width="87" height="30" rx="4" fill="#e2e8f0" stroke="#718096" stroke-width="1.2"/>
  <text x="399" y="350" font-size="12" font-weight="600" fill="#4a5568">3x</text>

  <text x="288" y="400" text-anchor="end" font-size="12.5" font-weight="700" fill="#22543d">Managed containers, object storage</text>
  <rect x="300" y="378" width="31" height="30" rx="4" fill="#9ae6b4" stroke="#2f855a" stroke-width="2"/>
  <text x="343" y="398" font-size="12" font-weight="700" fill="#22543d">baseline — chosen</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="540" fill="#fbfbfd"/>

  <text x="470" y="36" text-anchor="middle" font-size="19" font-weight="600" fill="#1a202c">Two graph representations, no path between them</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#4a5568">The barrier is why the deployment is single-instance and stateful</text>

  <!-- ===== UPPER BAND: what ships ===== -->
  <rect x="24" y="84" width="892" height="168" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="44" y="108" font-size="12" font-weight="600" fill="#2b6cb0" letter-spacing="0.6">DEPLOYABLE TODAY</text>

  <rect x="44" y="124" width="176" height="38" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="132" y="148" text-anchor="middle" font-size="13" fill="#1a202c">Knowledge Explorer</text>

  <rect x="44" y="170" width="176" height="38" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="132" y="194" text-anchor="middle" font-size="13" fill="#1a202c">REST API server</text>

  <rect x="44" y="216" width="176" height="26" rx="6" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="132" y="234" text-anchor="middle" font-size="13" fill="#1a202c">MCP server</text>

  <path d="M 220 143 L 300 168" stroke="#2b6cb0" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M 220 189 L 300 176" stroke="#2b6cb0" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M 220 229 L 300 186" stroke="#2b6cb0" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="258" y="126" text-anchor="middle" font-size="11" fill="#4a5568">each creates</text>

  <rect x="312" y="132" width="238" height="94" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="431" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Context Graph</text>
  <text x="431" y="182" text-anchor="middle" font-size="12" fill="#4a5568">nodes and edges held in</text>
  <text x="431" y="199" text-anchor="middle" font-size="12" fill="#4a5568">ordinary process memory</text>
  <text x="431" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#c53030">no storage backend</text>

  <path d="M 550 179 L 618 179" stroke="#a0aec0" stroke-width="1.6" fill="none" marker-end="url(#ar2)"/>
  <rect x="626" y="146" width="266" height="66" rx="8" fill="#fffaf0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="759" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#744210">Lives and dies with the process</text>
  <text x="759" y="193" text-anchor="middle" font-size="12" fill="#744210">one instance only, restart erases it</text>

  <!-- ===== BARRIER ===== -->
  <line x1="60" y1="286" x2="880" y2="286" stroke="#c53030" stroke-width="2.5" stroke-dasharray="10 7"/>
  <rect x="352" y="270" width="236" height="32" rx="16" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="470" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c53030">no selectable path between them</text>

  <!-- ===== LOWER BAND: library only ===== -->
  <rect x="24" y="322" width="892" height="188" rx="10" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <text x="44" y="346" font-size="12" font-weight="600" fill="#2f855a" letter-spacing="0.6">EXISTS IN THE LIBRARY, NOT EXPOSED BY ANY ENTRY POINT</text>

  <rect x="44" y="362" width="200" height="76" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="144" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#1a202c">Decision components</text>
  <text x="144" y="408" text-anchor="middle" font-size="11.5" fill="#4a5568">recorder, query, causal</text>
  <text x="144" y="424" text-anchor="middle" font-size="11.5" fill="#4a5568">analyser, policy engine</text>

  <path d="M 244 400 L 306 400" stroke="#2f855a" stroke-width="1.6" fill="none" marker-end="url(#ar3)"/>
  <text x="275" y="392" text-anchor="middle" font-size="11" fill="#4a5568">written against</text>

  <rect x="314" y="368" width="196" height="64" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2.5"/>
  <text x="412" y="394" text-anchor="middle" font-size="14" font-weight="600" fill="#1a202c">Graph store facade</text>
  <text x="412" y="415" text-anchor="middle" font-size="12" fill="#4a5568">backend is injected</text>

  <path d="M 510 400 L 566 400" stroke="#2f855a" stroke-width="1.6" fill="none" marker-end="url(#ar3)"/>

  <rect x="574" y="352" width="146" height="32" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.3"/>
  <text x="647" y="373" text-anchor="middle" font-size="12" fill="#1a202c">Neo4j</text>
  <rect x="574" y="390" width="146" height="32" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.3"/>
  <text x="647" y="411" text-anchor="middle" font-size="12" fill="#1a202c">FalkorDB</text>
  <rect x="574" y="428" width="146" height="32" rx="6" fill="#f0fff4" stroke="#2f855a" stroke-width="1.3"/>
  <text x="647" y="449" text-anchor="middle" font-size="12" fill="#1a202c">Apache AGE</text>

  <rect x="736" y="390" width="156" height="70" rx="6" fill="#fffaf0" stroke="#b7791f" stroke-width="2.5"/>
  <text x="814" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#744210">Amazon Neptune</text>
  <text x="814" y="433" text-anchor="middle" font-size="11.5" fill="#744210">works today, but is</text>
  <text x="814" y="449" text-anchor="middle" font-size="11.5" fill="#744210">unreachable from a service</text>
  <path d="M 720 424 L 730 424" stroke="#b7791f" stroke-width="1.6" fill="none" marker-end="url(#ar4)"/>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2b6cb0"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#a0aec0"/></marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2f855a"/></marker>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b7791f"/></marker>
  </defs>
</svg>
